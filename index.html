<style>
    /* Vites Yolu Tasarımı */
    .shifter-area {
        width: 220px;
        height: 260px;
        background: #111;
        border: 4px solid #333;
        border-radius: 20px;
        position: relative;
        margin-top: 20px;
        touch-action: none;
    }
    .gear-slot {
        position: absolute;
        width: 50px;
        height: 50px;
        background: rgba(255,255,255,0.05);
        border: 2px dashed #444;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: #666;
    }
    /* Vites Pozisyonları */
    #slot-1 { top: 10px; left: 10px; }
    #slot-3 { top: 10px; left: 85px; }
    #slot-5 { top: 10px; left: 160px; }
    #slot-2 { bottom: 10px; left: 10px; }
    #slot-4 { bottom: 10px; left: 85px; }
    #slot-N { top: 105px; left: 85px; border-style: solid; color: var(--blue); }

    #gear-knob {
        position: absolute;
        width: 60px;
        height: 60px;
        background: radial-gradient(#666, #222);
        border: 3px solid #eee;
        border-radius: 50%;
        top: 100px;
        left: 80px;
        cursor: grab;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
</style>

<div class="shifter-area" id="shifter-area">
    <div class="gear-slot" id="slot-1">1</div>
    <div class="gear-slot" id="slot-3">3</div>
    <div class="gear-slot" id="slot-5">5</div>
    <div class="gear-slot" id="slot-N">N</div>
    <div class="gear-slot" id="slot-2">2</div>
    <div class="gear-slot" id="slot-4">4</div>
    
    <div id="gear-knob">V</div>
</div>

<script>
    const knob = document.getElementById('gear-knob');
    const area = document.getElementById('shifter-area');
    let isDragging = false;

    // Vites Sürükleme Mantığı
    knob.addEventListener('pointerdown', (e) => {
        if(clutchVal > 0.8) { // Sadece debriyaj basılıyken sürüklenir
            isDragging = true;
            knob.style.cursor = 'grabbing';
        } else {
            updateStatus("VİTES KİLİTLİ! DEBRİYAJA BAS!");
        }
    });

    window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        
        const rect = area.getBoundingClientRect();
        let x = e.clientX - rect.left - 30;
        let y = e.clientY - rect.top - 30;

        // Sınırlandırma
        x = Math.max(0, Math.min(x, 160));
        y = Math.max(0, Math.min(y, 200));

        knob.style.left = x + 'px';
        knob.style.top = y + 'px';

        checkGearSnap(x, y);
    });

    window.addEventListener('pointerup', () => {
        isDragging = false;
        // Eğer vites bir yuvaya oturmadıysa boşa at (N)
        if (gear === -1) resetToNeutral();
    });

    function checkGearSnap(x, y) {
        // Her vites yuvası için mesafe kontrolü
        const slots = [
            {g: 1, x: 10, y: 10}, {g: 3, x: 85, y: 10}, {g: 5, x: 160, y: 10},
            {g: 2, x: 10, y: 170}, {g: 4, x: 85, y: 170}, {g: 0, x: 85, y: 100}
        ];

        slots.forEach(slot => {
            const dist = Math.sqrt(Math.pow(x - slot.x, 2) + Math.pow(y - slot.y, 2));
            if (dist < 30) {
                if (gear !== slot.g) {
                    gear = slot.g;
                    updateStatus(gear === 0 ? "VİTES: BOŞTA" : "VİTES: " + gear);
                    // Hafif bir "tık" hissi için görsel geri bildirim
                    knob.style.borderColor = "var(--green)";
                }
            }
        });
    }

    function resetToNeutral() {
        knob.style.left = '85px';
        knob.style.top = '100px';
        gear = 0;
    }
</script>
